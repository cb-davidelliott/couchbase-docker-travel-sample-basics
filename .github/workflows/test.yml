name: test

# Runs the exact flow a customer runs, on every push and pull request, and
# fails if any step breaks.
on:
  push:
  pull_request:

jobs:
  demo:
    # Pinned so a new default image cannot change CI behavior unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Cache Docker image layers (including the baked-in embedding model) so
      # repeat runs skip the slow pip install and model download.
      - uses: docker/setup-buildx-action@v4

      # `docker buildx bake` does not read .env on its own, so export the pinned
      # versions for the steps below (docker compose reads .env by itself).
      - name: Load versions from .env
        run: grep -E '^[A-Z_]+=' .env >> "$GITHUB_ENV"

      - name: Build the app image (cached)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: embed
          set: |
            *.cache-from=type=gha,scope=app-image
            *.cache-to=type=gha,scope=app-image,mode=max
            *.output=type=docker

      # Cache the Couchbase image (about 3 GB) between runs.
      - name: Cache Couchbase image
        id: cb-cache
        uses: actions/cache@v6
        with:
          path: /tmp/couchbase-image.tar
          key: couchbase-image-${{ hashFiles('.env') }}

      - name: Load or pull the Couchbase image
        run: |
          set -a; . ./.env; set +a
          if [ -f /tmp/couchbase-image.tar ]; then
            docker load -i /tmp/couchbase-image.tar
          else
            docker pull "$COUCHBASE_IMAGE"
            docker save "$COUCHBASE_IMAGE" -o /tmp/couchbase-image.tar
          fi

      - name: Lint and format check (ruff)
        run: |
          pipx run --spec ruff==0.17.3 ruff check app
          pipx run --spec ruff==0.17.3 ruff format --check app

      - name: Unit tests
        run: docker compose run --rm --no-deps app python -m unittest discover -s tests -t .

      - name: Start Couchbase, load data, build indexes, create embeddings
        run: docker compose up -d --wait

      - name: Web UI is serving
        run: curl -sf http://localhost:8501/_stcore/health

      - name: Web UI integration test (every step of every demo, and the playground)
        run: docker compose run --rm app python -m unittest discover -s integration -t .

      - name: Demo 1 - Key-Value and SQL++
        run: docker compose run --rm app python kv_and_queries.py

      - name: Demo 2 - Full Text Search
        run: docker compose run --rm app python search_demo.py

      - name: Demo 3 - Vector search
        run: docker compose run --rm app python vector_demo.py

      - name: Deep-dive commands
        run: |
          docker compose run --rm app python deepdive.py explain 'SELECT name FROM `travel-sample`.inventory.airline WHERE country = "France"'
          docker compose run --rm app python deepdive.py bench --runs 20
          docker compose run --rm app python deepdive.py recall

      - name: Run all demos (the customer's default command)
        run: docker compose run --rm app

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
